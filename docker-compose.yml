# Ketsa local/dev orchestration.
#
#   docker compose up --build
#
# brings up the FastAPI backend (api:8000) and the Next.js frontend (web:3000).
# Open http://localhost:3000 in your browser.
#
# Production notes:
#   * Set KETSA_ALLOWED_ORIGINS to the real hosted frontend origin.
#   * Put the services behind a TLS-terminating reverse proxy (Caddy/Nginx/Traefik).
#   * The in-memory rate limiter is per-instance; put a shared limiter in front
#     if you scale to multiple backend replicas.
#   * Admin panel (/admin): set a strong KETSA_ADMIN_PASSWORD (default below is
#     for local dev only) and uncomment the volume so saved edits persist.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - KETSA_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - KETSA_EXPOSE_DOCS=0
      - KETSA_RATE_LIMIT_PER_MIN=120
      - KETSA_ADMIN_PASSWORD=ketsa-admin
      # - KETSA_DB_PATH=/data/ketsa.db
    ports:
      - "8000:8000"
    # volumes:
    #   - ketsa_data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # Next.js server fetches data from the api service over the compose network.
      - KETSA_BACKEND_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

