# Ketsa local/dev orchestration.
#
#   docker compose up --build
#
# brings up the FastAPI backend (api:8000) and the Next.js frontend (web:3000).
# Open http://localhost:3000 in your browser.
#
# Production notes:
#   * Set KETSA_ALLOWED_ORIGINS to the real hosted frontend origin.
#   * Put the services behind a TLS-terminating reverse proxy (Caddy/Nginx/Traefik).
#   * The in-memory rate limiter is per-instance; put a shared limiter in front
#     if you scale to multiple backend replicas.
#   * Admin panel (/admin): set a strong KETSA_ADMIN_PASSWORD (default below is
#     for local dev only). The backend seeds in-memory by default, so admin
#     edits reset on restart; set KETSA_DB_BACKEND=supabase with SUPABASE_URL/
#     SUPABASE_SERVICE_ROLE_KEY to persist them (see .env.example).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - KETSA_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - KETSA_EXPOSE_DOCS=0
      - KETSA_RATE_LIMIT_PER_MIN=120
      - KETSA_ADMIN_PASSWORD=ketsa-admin
      # Shared with `web` below. Lets the frontend proxy tell the API the real
      # caller IP (HMAC-signed) instead of the proxy's own address, so the
      # rate limiter and admin lockout stay per-visitor. Leave empty to disable
      # signing (backend then uses its direct peer / trusted-proxy CIDRs).
      - KETSA_PROXY_SECRET=${KETSA_PROXY_SECRET:-}
      # Optional comma-separated IPs/CIDRs of proxies whose X-Forwarded-For is
      # trusted. Not needed when KETSA_PROXY_SECRET is set.
      - KETSA_TRUSTED_PROXIES=${KETSA_TRUSTED_PROXIES:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # Next.js server fetches data from the api service over the compose network.
      - KETSA_BACKEND_URL=http://api:8000
      # Must match the api service's value. Signs the real client IP so the
      # backend's per-IP limits and admin lockout see the visitor, not this
      # container.
      - KETSA_PROXY_SECRET=${KETSA_PROXY_SECRET:-}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped
